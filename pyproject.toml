[project]
name = "sync"
version = "0.3.0"
description = "Monorepo for developer automation: pr, rl, dp, glint"
authors = [
    {name = "antoniooreany"}
]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "google-genai"
]

[project.scripts]
pr = "pr_sync.cli:main"
rl = "release_sync.cli:main"
dp = "dependabot_sync.cli:main"
gl = "gitlint_sync.cli:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
